# pytest.ini - Pytest Configuration for Flask Application Testing
# Generated as part of Node.js to Flask migration project
# Configures test discovery, markers, coverage, and execution parameters

[pytest]
# Test discovery patterns
# Defines which files, classes, and functions pytest should recognize as tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
# Root directory where pytest will search for tests
testpaths = tests

# Minimum pytest version required
minversion = 8.0

# Custom test markers for selective test execution
# Usage: pytest -m "unit" to run only unit tests
# Usage: pytest -m "not slow" to skip slow tests
markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (slower, may use database or external services)
    functional: Functional tests (end-to-end workflows)
    slow: Tests that take more than 1 second to execute
    smoke: Critical smoke tests for basic functionality validation
    api: API endpoint tests
    database: Tests requiring database access
    external: Tests involving external services (mocked)

# Default pytest options
# -v: Verbose output showing each test
# --strict-markers: Fail on unregistered markers to catch typos
# --tb=short: Short traceback format for cleaner output
# --cov=app: Measure code coverage for the 'app' package
# --cov-report=term-missing: Show lines not covered by tests
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-config=.coveragerc

# Console output format
console_output_style = progress

# Test execution options
# Show extra test summary info for all outcomes except passed
# a: all except passed, f: failed, E: error, s: skipped, x: xfailed, X: xpassed
addopts_summary = -ra

# Disable cacheprovider warnings
cache_dir = .pytest_cache

# Log configuration for better debugging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# File-level logging (captured logs)
log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Warning filters
# Suppress specific warnings that are known and harmless
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:flask_sqlalchemy

# Test collection options
# Don't descend into these directories during test collection
norecursedirs = 
    .git
    .tox
    .env
    .venv
    venv
    __pycache__
    *.egg
    build
    dist
    htmlcov
    node_modules
    migrations

# Pytest plugins to enable
# These plugins provide additional functionality
# pytest-cov: Code coverage measurement
# pytest-mock: Mocking and patching utilities
# pytest-flask: Flask-specific test utilities
plugins = 
    pytest_cov
    pytest_mock

# Timeout settings (if pytest-timeout is installed)
# Prevents tests from hanging indefinitely
# timeout = 300
# timeout_method = thread

# Parallel execution settings (if pytest-xdist is installed)
# numprocesses = auto
# dist = loadscope

# Coverage fail-under threshold
# Tests will fail if coverage drops below this percentage
# Can be overridden with: pytest --cov-fail-under=85
# addopts_coverage = --cov-fail-under=85

# Doctest configuration (if testing docstrings)
doctest_optionflags = 
    NORMALIZE_WHITESPACE
    ELLIPSIS

# Flask-specific test configuration notes:
# - Use Flask test_client() fixture for API endpoint testing
# - Use app_context() for database operations requiring application context
# - Use test database (SQLite in-memory or dedicated test DB)
# - Mock external services using pytest-mock or responses library
# - Isolate tests with database transaction rollback in fixtures

# Performance targets:
# - Unit tests: <100ms per test average
# - Integration tests: <1s per test average
# - Functional tests: <5s per test average
# - Full test suite: <10 minutes total

# Coverage targets per Agent Action Plan:
# - Overall line coverage: 85% minimum
# - Branch coverage: 80% minimum
# - Function coverage: 90% minimum
# - Critical paths (auth, authorization): 100%

# Test execution commands:
# Run all tests:                     pytest
# Run with coverage:                 pytest --cov=app
# Run specific marker:               pytest -m unit
# Run excluding slow tests:          pytest -m "not slow"
# Run parallel (with xdist):         pytest -n auto
# Run with verbose output:           pytest -vv
# Run specific test file:            pytest tests/unit/test_example.py
# Run with debugging on failure:     pytest --pdb
# Generate HTML coverage report:     pytest --cov=app --cov-report=html

# Marker usage examples:
# @pytest.mark.unit
# @pytest.mark.integration
# @pytest.mark.slow
# @pytest.mark.api
# @pytest.mark.database
