# Pytest Configuration for Flask Testing
# Generated for Node.js to Flask migration project

[pytest]
# Test Discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test Execution Options
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-fail-under=85

# Test Markers for Categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, database)
    functional: Functional tests (end-to-end workflows)
    slow: Tests that take >1 second
    smoke: Critical smoke tests
    api: API endpoint tests
    database: Tests requiring database
    external: Tests involving external services (mocked)
    admin: Admin workflow and permission tests

# Filter Warnings
filterwarnings =
    ignore::DeprecationWarning

# Async Support
asyncio_mode = auto
